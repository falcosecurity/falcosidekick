{{- if .Values.management.service.enabled }}
{{- $cfg := include "falcosidekick.sidekickConfig" . | fromYaml }}
{{- $name := (dig "tls" "enabled" false $cfg) | ternary "https-mgmt" "http-mgmt" }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "falcosidekick.fullname" . }}-management
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "falcosidekick.labels" . | nindent 4 }}
    app.kubernetes.io/component: management
  {{- with .Values.management.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: ClusterIP
  selector:
    {{- include "falcosidekick.selectorLabels" . | nindent 4 }}
  ports:
    - name: {{ $name }}
      port: {{ .Values.management.service.port }}
      targetPort: {{ $name }}
      protocol: TCP
{{- end }}
