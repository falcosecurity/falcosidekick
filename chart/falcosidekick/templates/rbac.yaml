{{- if .Values.rbac.policyReport }}
{{- $name := include "falcosidekick.policyReportRoleName" . }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ $name }}
  labels:
    {{- include "falcosidekick.labels" . | nindent 4 }}
rules:
  # create cannot be limited by name; the output reads and updates only the reports named falcosidekick.
  - apiGroups:
      - openreports.io
    resources:
      - reports
      - clusterreports
    verbs:
      - create
  - apiGroups:
      - openreports.io
    resources:
      - reports
      - clusterreports
    resourceNames:
      - falcosidekick
    verbs:
      - get
      - update
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ $name }}
  labels:
    {{- include "falcosidekick.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ $name }}
subjects:
  - kind: ServiceAccount
    name: {{ include "falcosidekick.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
