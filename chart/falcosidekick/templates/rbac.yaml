{{- if .Values.rbac.policyReport }}
{{- $name := printf "%s-%s-policyreport" .Release.Namespace (include "falcosidekick.fullname" .) | trunc 63 | trimSuffix "-" }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ $name }}
  labels:
    {{- include "falcosidekick.labels" . | nindent 4 }}
rules:
  - apiGroups:
      - openreports.io
    resources:
      - reports
      - clusterreports
    verbs:
      - get
      - create
      - update
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ $name }}
  labels:
    {{- include "falcosidekick.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ $name }}
subjects:
  - kind: ServiceAccount
    name: {{ include "falcosidekick.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
