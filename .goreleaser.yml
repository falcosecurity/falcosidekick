version: 2

project_name: falcosidekick
dist: dist/release

env:
  - GO111MODULE=on
  - DOCKER_CLI_EXPERIMENTAL=enabled
  - DOCKER_BUILDKIT=1
  - BUILDX_PLATFORMS=linux/amd64,linux/arm64
  - COSIGN_YES=true

snapshot:
  version_template: "v3-main"

checksum:
  name_template: "falcosidekick-checksums.txt"

before:
  hooks:
    - sh -c "cd ui && bun install --frozen-lockfile"
    - sh -c "cd ui && bun run build"

sboms:
  - artifacts: archive

builds:
  - id: falcosidekick
    main: ./cmd/falcosidekick
    binary: falcosidekick
    mod_timestamp: "{{ .CommitTimestamp }}"
    goos:
      - linux
    goarch:
      - amd64
      - arm64
    env:
      - CGO_ENABLED=0
    flags:
      - -mod=readonly
      - -trimpath
      - -tags=builtinui
    ldflags:
      - -s -w
      - -X github.com/falcosecurity/falcosidekick/internal/version.Version={{ .Version }}
      - -X github.com/falcosecurity/falcosidekick/internal/version.Commit={{ .FullCommit }}
      - -X github.com/falcosecurity/falcosidekick/internal/version.BuildDate={{ .CommitDate }}

  - id: falcosidekick-slim
    main: ./cmd/falcosidekick
    binary: falcosidekick-slim
    mod_timestamp: "{{ .CommitTimestamp }}"
    goos:
      - linux
    goarch:
      - amd64
      - arm64
    env:
      - CGO_ENABLED=0
    flags:
      - -mod=readonly
      - -trimpath
    ldflags:
      - -s -w
      - -X github.com/falcosecurity/falcosidekick/internal/version.Version={{ .Version }}
      - -X github.com/falcosecurity/falcosidekick/internal/version.Commit={{ .FullCommit }}
      - -X github.com/falcosecurity/falcosidekick/internal/version.BuildDate={{ .CommitDate }}

archives:
  - id: falcosidekick
    ids:
      - falcosidekick
    name_template: "falcosidekick_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
  - id: falcosidekick-slim
    ids:
      - falcosidekick-slim
    name_template: "falcosidekick_{{ .Version }}_{{ .Os }}_{{ .Arch }}_slim"

dockers_v2:
  - id: falcosidekick-ui
    dockerfile: Dockerfile
    ids:
      - falcosidekick
    platforms:
      - linux/amd64
      - linux/arm64
    images:
      - "falcosecurity/falcosidekick"
      - "public.ecr.aws/falcosecurity/falcosidekick"
    tags:
      - "{{ .Version }}"
      - '{{ if eq (index .Env "FSK_LATEST_MINOR") "true" }}{{ .Major }}.{{ .Minor }}{{ end }}'
      - '{{ if eq (index .Env "FSK_LATEST_MAJOR") "true" }}{{ .Major }}{{ end }}'
      - '{{ if eq (index .Env "FSK_LATEST_MAJOR") "true" }}v3-latest{{ end }}'
    build_args:
      BINARY: falcosidekick
      VARIANT: ui
    labels:
      "org.opencontainers.image.created": "{{ .CommitDate }}"
      "org.opencontainers.image.name": "falcosidekick"
      "org.opencontainers.image.revision": "{{ .FullCommit }}"
      "org.opencontainers.image.version": "{{ .Version }}"
      "io.falcosecurity.falcosidekick.variant": "ui"
    extra_files:
      - LICENSE

  - id: falcosidekick-slim
    dockerfile: Dockerfile
    ids:
      - falcosidekick-slim
    platforms:
      - linux/amd64
      - linux/arm64
    images:
      - "falcosecurity/falcosidekick"
      - "public.ecr.aws/falcosecurity/falcosidekick"
    tags:
      - "{{ .Version }}-slim"
      - '{{ if eq (index .Env "FSK_LATEST_MINOR") "true" }}{{ .Major }}.{{ .Minor }}-slim{{ end }}'
      - '{{ if eq (index .Env "FSK_LATEST_MAJOR") "true" }}{{ .Major }}-slim{{ end }}'
      - '{{ if eq (index .Env "FSK_LATEST_MAJOR") "true" }}v3-latest-slim{{ end }}'
    build_args:
      BINARY: falcosidekick-slim
      VARIANT: slim
    labels:
      "org.opencontainers.image.created": "{{ .CommitDate }}"
      "org.opencontainers.image.name": "falcosidekick"
      "org.opencontainers.image.revision": "{{ .FullCommit }}"
      "org.opencontainers.image.version": "{{ .Version }}"
      "io.falcosecurity.falcosidekick.variant": "slim"
    extra_files:
      - LICENSE

signs:
  - id: falcosidekick
    signature: "${artifact}.bundle"
    cmd: cosign
    args: ["sign-blob", "--bundle", "${artifact}.bundle", "${artifact}"]
    artifacts: archive
  - id: checksum
    signature: "${artifact}.bundle"
    cmd: cosign
    args: ["sign-blob", "--bundle", "${artifact}.bundle", "${artifact}"]
    artifacts: checksum

docker_signs:
  - id: falcosidekick
    cmd: cosign
    args: ["sign", "--recursive", "${artifact}"]
    output: true

release:
  github:
    owner: falcosecurity
    name: falcosidekick
  prerelease: auto
  name_template: "falcosidekick {{ .Version }}"
