# falcosidekick - core configuration (sidekick.yaml)
#
# Server, logging, TLS, database, UI, enrichment, and runtime defaults.
# Outputs are configured separately via -o flag (see config_example_outputs.yaml).
#
# Usage: falcosidekick -c sidekick.yaml -o outputs.yaml [-o more-outputs.yaml]

# =============================================================================
# Server
# =============================================================================

listen_address: ""            # empty listens on every interface, IPv4 and IPv6
listen_port: 2801             # Falco events, /livez, /readyz, /metrics
shutdown_delay: 5s            # after SIGTERM /readyz fails and events are still accepted this long

# The API and the UI have their own listener; the API has no authentication.
# management:
#   listen_address: "127.0.0.1"         # "::" for every interface; empty is refused
#   listen_port: 2802

# =============================================================================
# Logging
# Log level can be overridden via FALCOSIDEKICK_LOG_LEVEL env var.
# =============================================================================

log_level: info               # debug, info, warn, error
log_format: text              # text (human-readable), json (structured)

# =============================================================================
# Server TLS
# When enabled, Falco must be configured to send events over HTTPS.
# Client TLS for outputs is configured per-output under tls: sub-key.
# =============================================================================

# tls:
#   enabled: false                       # enable HTTPS listener
#   cert_file: /etc/certs/server.crt     # server certificate
#   key_file: /etc/certs/server.key      # server private key
#   mutual_tls: false                    # require client certificate
#   ca_file: /etc/certs/ca.crt           # CA for client cert verification

# =============================================================================
# Database
# Stores the outputs, from the output files and created through the API, and
# the UI layout. inmemory loses API outputs and the layout on restart. With
# sqlite or postgres no secret value is stored: secrets are written as
# <field>_file (headers and query parameters: files).
# =============================================================================

database:
  backend: inmemory           # inmemory (default), sqlite, postgres
#   connect_timeout: 30s                 # bound for opening and migrating at startup
#   sqlite:                              # one Sidekick instance, local filesystem
#     path: /var/lib/falcosidekick/sidekick.db   # created with mode 0600
#   postgres:                            # several instances can share it
#     host: postgres
#     port: 5432
#     database: falcosidekick
#     user: falcosidekick
#     password_file: /run/secrets/postgres-password   # or password; masked by GET /api/v1/config
#     sslmode: verify-full               # disable, require, verify-ca, verify-full
#     tls:
#       ca_file: /etc/falcosidekick/postgres-ca.pem   # system CAs when empty
#     max_connections: 4
#     poll_interval: 10s                 # how often to check for changes made by other instances

# =============================================================================
# UI
# Built-in web interface for event visualization and pipeline monitoring.
# event_source selects which output serves event queries for the UI.
# =============================================================================

# api:
#   allow_writes: false                  # allow API routes that change outputs and layout.
#                                        # They have no authentication: enable only on a
#                                        # trusted network or with management.listen_address
#                                        # 127.0.0.1.
#   secret_dirs: []                      # absolute directories a file path sent through the
#                                        # API must resolve into, such as a mounted secret
#                                        # volume. Empty refuses every file path from the API.

# metrics:
#   max_label_values: 1000               # distinct values kept per label taken from events;
#                                        # later values are recorded as "other"
#   extra_labels: []                     # output fields added as labels to
#                                        # falcosidekick_events_total, e.g. [k8s.ns.name];
#                                        # dots become underscores; each value is a new series

# provisioning:
#   allow_ui_updates: false              # allow API/UI changes to outputs defined in files;
#                                        # the next file reload restores the file version

# ui:
#   enabled: false                       # enable the web UI
#   event_source: inmemory               # output name implementing ReadableStore

# =============================================================================
# Enrichment
# Fields, tags, and templates added to every event before dispatch.
# =============================================================================

# enricher:
#   custom_fields:                       # static fields added to every event
#     environment: production
#     cluster: us-west-2
#   custom_tags:                         # static tags added to every event
#     - security
#   templated_fields:                    # Go template fields (event.OutputFields as data)
#     namespace: '{{ or (index . "k8s.ns.name") "unknown" }}'
#   bracket_replacer: "_"                # replace [ and ] in field names
#   truncate_event_threshold: 0          # off by default; above this event JSON size, long fields are cut
#   truncate_field_threshold: 512        # length a field is cut to once event truncation is on (> 5)

# =============================================================================
# Hot-Reload
# Output config files (-o) are watched for changes and reloaded automatically.
# Core config (this file) requires a restart. Triggers: fsnotify, SIGHUP, polling.
# =============================================================================

# reload:
#   poll_interval: 30s             # content hash poll for K8s ConfigMap symlink swaps (0 disables)
#   retire_timeout: 10s            # max wait for replaced and removed outputs to drain, all together

# =============================================================================
# Runtime Defaults
# Default runtime settings applied to ALL outputs.
# Individual outputs can override these under their runtime: sub-key.
# =============================================================================

runtime_defaults:
  queue_size: 1000            # per-output event queue capacity
  workers: 2                  # worker goroutines per output
  # A rejection that no retry can fix (HTTP 4xx except 408, 409, 425 and 429,
  # an untrusted certificate, an invalid payload, the destination's own
  # permanent codes) fails the event at once and does not count toward
  # opening the circuit.
  retry:
    max_attempts: 3           # attempts before marking event as failed
    initial_interval: 1s      # first retry backoff
    max_interval: 30s         # maximum retry backoff
    multiplier: 2.0           # exponential backoff multiplier
  # While the circuit is open, workers stop taking events and the queue waits.
  circuit_breaker:
    failure_threshold: 5      # consecutive failures to open circuit
    success_threshold: 2      # successes in half-open to close circuit
    reset_timeout: 30s        # time before half-open after open
  batching:
    enabled: false            # enable batch delivery (outputs must implement BatchSender)
    batch_size: 500           # events per batch
    flush_interval: 1s        # max time before flushing partial batch
  health_check: true          # probe each destination before it starts (false skips it)
