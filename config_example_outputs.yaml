# falcosidekick - output configuration (outputs.yaml)
#
# Defines which outputs receive Falco events.
# Multiple output files can be merged with repeated -o flags.
# Files are processed left-to-right; same output names deep-merge.
#
# Secret fields support _file suffix for file-backed secrets:
#   password_file: /run/secrets/es-password  (reads file content as password)
#   Direct values take precedence over _file when both are set.
#
# Per-output runtime overrides (under the runtime: sub-key):
#   runtime:
#     minimum_priority: ""             # minimum event priority (empty = all)
#     queue_size: 1000                 # override runtime_defaults
#     workers: 2                       # override runtime_defaults
#     batching:
#       enabled: false
#       batch_size: 500
#       flush_interval: 1s
#     health_check: true               # false skips the destination probe
#
# Health check: at startup, on reload and on API PUT each output probes its
# destination for at most 5s, all outputs concurrently. Rejected credentials (401/403), a wrong path
# (404), an untrusted certificate or a Kafka SASL failure stop startup or
# reject the change. Elasticsearch treats 403 as transient, since GET / needs
# the monitor privilege. Any other failure starts the output as "degraded"
# with last_warning until the first delivery. Webhook and Slack are not
# probed: their endpoint accepts only POST.
#
# Target fields (available to all HTTP-based outputs unless noted):
#   host:                 scheme, host and port only, e.g. https://collector:8443
#                         Credentials, path, query and fragment are rejected.
#   base_path:            public prefix applied to every route of the output,
#                         including health checks. A trailing slash is removed.
#   endpoint:             public delivery path, relative to base_path
#   secret_endpoint:      delivery path holding a credential (or secret_endpoint_file)
#                         Never returned by the API. Cannot be combined with endpoint.
#   query_params:         values, then secrets, then files for each parameter
#     team:
#       values: ["security"]
#     token:
#       secrets: ["TOKEN"]
#     signature:
#       files: ["/run/secrets/signature"]  # read and trimmed on each request
#   # Names and values are escaped. Files are checked at startup.
#
# Shared HTTP fields (available to all HTTP-based outputs):
#   username:             basic auth username
#   password:             basic auth password (or password_file)
#   bearer_token:         bearer token (or bearer_token_file)
#   headers:              values, then secrets, then files for each header
#     X-Team:
#       values: ["security"]
#     X-Api-Key:
#       secrets: ["TOKEN"]
#     X-Client-Key:
#       files: ["/run/secrets/client-key"]  # read and trimmed on each request
#   # Files are checked at startup by config validation and sender construction.
#   # Relative paths use the process working directory, as scalar _file does.
#   # Authorization must use secrets or files, without basic/bearer auth.
#   # Header names are case-insensitive; duplicate names are rejected.
#   # Each entry accepts only values/secrets/files string lists (or null to clear).
#   # Duplicate case aliases of those properties are rejected.
#   # Framing, connection, proxy and compression headers are transport-owned.
#   # Redirects are followed only within the same origin; others are refused.
#   tls:
#     insecure_skip_verify: false
#     ca_file: ""
#     cert_file: ""
#     key_file: ""
#     server_name: ""

outputs:

  # ===========================================================================
  # In-memory Event Store
  # Required when ui.event_source is "inmemory".
  # ===========================================================================

  # inmemory:
  #   capacity: 10000                    # max events in ring buffer
  #   ttl: 0                             # event TTL (0 = no expiry)
  #   # gc_interval: 10s                 # with ttl only: interval between removals of expired events

  # ===========================================================================
  # Webhook
  # ===========================================================================

  # webhook:
  #   host: "https://my-service"
  #   endpoint: /events                  # default: /
  #   method: POST                       # POST (default) or PUT

  # ===========================================================================
  # Slack
  # ===========================================================================

  # slack:
  #   # host: "https://hooks.slack.com"  # default
  #   secret_endpoint: /services/XXX/YYY/ZZZ
  #   # secret_endpoint_file: /run/secrets/slack-endpoint
  #   output_format: all                 # all, fields, text
  #   # footer: "prod cluster"
  #   # message_template: "{{ .Rule }} on {{ .Hostname }}"
  #   runtime:
  #     minimum_priority: warning

  # ===========================================================================
  # Elasticsearch (with runtime overrides)
  # ===========================================================================

  # elasticsearch:
  #   host: "https://elasticsearch:9200"
  #   # base_path: /es                   # routes are set by the output
  #   # filter_path, pipeline and op_type are not allowed in query_params
  #   # Use either username/password_file or api_key_file, not both.
  #   # password_file: /run/secrets/es-password
  #   # api_key_file: /run/secrets/es-api-key
  #   # Documents use the event UUID as _id: retries never index an event twice.
  #   index: falco
  #   index_suffix: daily                # daily, monthly, annually, none; dates in UTC; none with data_stream
  #   # data_stream: true                # write to index as a data stream (create only, no date suffix)
  #   # number_of_shards: 1              # unset leaves the cluster default
  #   # number_of_replicas: 1            # unset leaves the cluster default
  #   runtime:
  #     queue_size: 5000
  #     workers: 3
  #     batching:
  #       enabled: true
  #       batch_size: 1000
  #       flush_interval: 1s

  # ===========================================================================
  # Loki
  # ===========================================================================

  # loki:
  #   host: "http://loki:3100"
  #   # endpoint: /loki/api/v1/push      # default
  #   tenant: "security"
  #   # label_fields: [container.name]   # output fields as stream labels (. and [ become _)
  #   runtime:
  #     minimum_priority: notice

  # ===========================================================================
  # Alertmanager
  # ===========================================================================

  # alertmanager:
  #   hosts:
  #     - "http://alertmanager:9093"     # scheme, host and port only
  #   # base_path: /alertmanager         # same for every host
  #   # endpoint: /api/v2/alerts         # default
  #   # expires_after: 30m               # Go duration; 0 leaves it to resolve_timeout
  #   runtime:
  #     minimum_priority: warning

  # ===========================================================================
  # Kafka
  # ===========================================================================

  # kafka:
  #   brokers:
  #     - "kafka:9092"
  #   topic: "falco-events"
  #   auth:
  #     sasl: PLAIN                      # PLAIN, SCRAM-SHA-256, SCRAM-SHA-512
  #     username: falcosidekick
  #     password_file: /run/secrets/kafka-password
  #   producer:
  #     required_acks: all               # all, one, none
  #     delivery_timeout: 10s            # max wait per record, also bounds the flush on shutdown
  #     # compression: zstd              # unset keeps the client default (snappy)
  #     # client_id: falcosidekick       # default
  #   # tls:
  #   #   enabled: true

  # ===========================================================================
  # Microsoft Teams (Workflows webhook, Adaptive Card)
  # ===========================================================================

  # teams:
  #   host: "https://prod-00.westeurope.logic.azure.com"
  #   secret_endpoint: /workflows/WORKFLOW_ID/triggers/manual/paths/invoke
  #   query_params:
  #     api-version:
  #       values: ["2016-06-01"]
  #     sig:                             # a credential: secrets or files, never values
  #       secrets: ["SIGNATURE"]         # or files: [/run/secrets/teams-sig]
  #   output_format: all                 # all, fields, text
  #   # icon_url: "https://example.com/falco.png"

  # ===========================================================================
  # Discord
  # ===========================================================================

  # discord:
  #   # host: "https://discord.com"      # default
  #   secret_endpoint: /api/webhooks/WEBHOOK_ID/WEBHOOK_TOKEN
  #   # avatar_url: "https://example.com/falco.png"

  # ===========================================================================
  # Grafana OnCall / Grafana Cloud IRM (formatted webhook)
  # ===========================================================================

  # grafanaoncall:
  #   host: "https://oncall-prod-eu-west-0.grafana.net"
  #   secret_endpoint: /oncall/integrations/v1/formatted_webhook/TOKEN/

  # ===========================================================================
  # PagerDuty (Events API v2)
  # ===========================================================================

  # pagerduty:
  #   region: us                         # us, eu; selects the default host
  #   routing_key_file: /run/secrets/pagerduty-routing-key

  # ===========================================================================
  # Opsgenie (Alert API v2). Atlassian ends Opsgenie on 2027-04-05.
  # ===========================================================================

  # opsgenie:
  #   region: us                         # us, eu; selects the default host
  #   api_key_file: /run/secrets/opsgenie-api-key

  # ===========================================================================
  # Datadog (Events API v2)
  # ===========================================================================

  # datadog:
  #   site: datadoghq.com                # datadoghq.eu, us3.datadoghq.com, ...; selects the hosts
  #   api_key_file: /run/secrets/datadog-api-key
  #   app_key_file: /run/secrets/datadog-app-key  # required

  # ===========================================================================
  # Falco Talon
  # ===========================================================================

  # talon:
  #   host: "http://falco-talon:2803"
  #   # endpoint: /                      # default; health check uses /healthz

  # ===========================================================================
  # CloudEvents (HTTP binary mode)
  # ===========================================================================

  # cloudevents:
  #   host: "http://broker-ingress.knative-eventing.svc"
  #   endpoint: /default/default
  #   source: /falcosidekick             # required; names the producing context
  #   extensions:
  #     cluster: prod

  # ===========================================================================
  # Google Cloud Pub/Sub
  # ===========================================================================

  # gcppubsub:
  #   project_id: "my-project"
  #   topic: "falco-events"              # topic ID; the topic must exist
  #   # Without credentials the output uses Application Default Credentials:
  #   # GOOGLE_APPLICATION_CREDENTIALS, GKE Workload Identity or the metadata server.
  #   # credentials_file: /run/secrets/gcp-credentials.json  # JSON key
  #   attributes:                        # static, added to every message
  #     cluster: prod
  #   message_attributes: [priority, rule, source, tags, hostname]
  #   # endpoint: "europe-west1-pubsub.googleapis.com:443"   # gRPC host:port, TLS
  #   # emulator_host: "localhost:8085"  # plaintext, no authentication; not with endpoint or credentials
  #   # The health check reads the topic: it needs pubsub.topics.get (for example
  #   # roles/pubsub.viewer) besides pubsub.topics.publish. Without it the output
  #   # starts degraded; a missing topic or rejected credentials stop startup.

  # ===========================================================================
  # PolicyReport (openreports.io/v1alpha1 Report and ClusterReport)
  # ===========================================================================

  # policyreport:
  #   # kubeconfig: /etc/falcosidekick/kubeconfig  # in-cluster configuration when empty
  #   # fallback_namespace: falco        # default: the pod namespace, else "default"
  #   max_results: 1000                  # results per report, also set as configuration.limits.maxResults
  #   prune_by_priority: false           # true removes the oldest lowest-severity result first
  #   # Events with k8s.ns.name (or ka.target.namespace) go to the Report
  #   # "falcosidekick" of that namespace, others to the ClusterReport
  #   # "falcosidekick". A namespace that does not exist uses fallback_namespace.
  #   # Results are fail from Error up, warn below.
  #   # The openreports.io CRDs must be installed. RBAC: get, create and update
  #   # on reports and clusterreports.openreports.io. The health check stops
  #   # startup when the API is not served or access is rejected.

  # ===========================================================================
  # AWS outputs (S3, SQS, SNS): shared fields
  # ===========================================================================
  #
  #   region: "eu-west-1"              # else AWS_REGION, the shared config files, then
  #                                    # the region in the queue URL or topic ARN
  #   access_key_id_file: /run/secrets/aws-access-key-id
  #   secret_access_key_file: /run/secrets/aws-secret-access-key
  #   session_token_file: ...          # optional, with temporary keys
  #   # Without static keys the SDK default chain applies: environment, shared
  #   # files, web identity (EKS IRSA), EKS Pod Identity, ECS and EC2 roles.
  #   role_arn: "arn:aws:iam::123456789012:role/falcosidekick"  # assumed with STS
  #   external_id: "..."               # only with role_arn
  #   endpoint: "http://localstack:4566"  # scheme, host and port; replaces the
  #                                    # service endpoint (LocalStack, S3-compatible
  #                                    # stores, VPC endpoints). STS keeps its own
  #                                    # endpoint; set AWS_ENDPOINT_URL_STS to change it.
  #   tls:                             # for the custom endpoint: ca_file, client cert
  #   # Each API call is attempted once and bounded to 30s; runtime.retry retries.
  #   # The health check stops startup when AWS rejects the credentials or the
  #   # bucket, queue or topic does not exist. It reads the resource: without
  #   # that read permission (AccessDenied) the output starts degraded.

  # ===========================================================================
  # AWS S3
  # ===========================================================================

  # awss3:
  #   region: "eu-west-1"
  #   bucket: "falco-events"
  #   prefix: falco                      # empty writes the keys at the bucket root
  #   # object_canned_acl: bucket-owner-full-control  # unset sends no ACL
  #   # use_path_style: true             # path-style URLs, for most S3-compatible stores
  #   # One object per event: <prefix>/<YYYY-MM-DD>/<event time>_<uuid>.json, in UTC,
  #   # the time in basic ISO 8601 (20260102T150405.000000000Z).
  #   # With runtime.batching one object per batch, one JSON event per line:
  #   # <prefix>/<YYYY-MM-DD>/<first event time>_<first uuid>.ndjson.
  #   # A retry writes the same key. The health check (HeadBucket) needs s3:ListBucket.
  #   runtime:
  #     batching:
  #       enabled: true
  #       batch_size: 500
  #       flush_interval: 10s

  # ===========================================================================
  # AWS SQS
  # ===========================================================================

  # awssqs:
  #   queue_url: "https://sqs.eu-west-1.amazonaws.com/123456789012/falco"
  #   # The message body is the event JSON. With runtime.batching events go
  #   # through SendMessageBatch, 10 messages and 1 MiB per request; the batch
  #   # fails when any message fails. FIFO queues are not supported. The health
  #   # check (GetQueueAttributes) needs sqs:GetQueueAttributes.

  # ===========================================================================
  # AWS SNS
  # ===========================================================================

  # awssns:
  #   topic_arn: "arn:aws:sns:eu-west-1:123456789012:falco"
  #   format: json                       # json (default) or text
  #   message_attributes: [priority, rule, source, tags, hostname]
  #   # json sends the event JSON, text the event output text; both carry the
  #   # listed attributes: the five above or output field names with a string or
  #   # number value (proc.aname[2] becomes proc.aname.2). At most 10, since raw
  #   # delivery to SQS drops messages with more. Empty values are left out;
  #   # numbers beyond +-10^9 are sent as strings. FIFO topics are not supported.
  #   # The health check (GetTopicAttributes) needs sns:GetTopicAttributes.

  # ===========================================================================
  # Syslog (RFC 5424 over UDP, TCP or TLS)
  # ===========================================================================

  # syslog:
  #   host: "syslog.example.com"
  #   # port: 514                        # default 514, 6514 with tls.enabled
  #   protocol: tcp                      # tcp or udp
  #   format: json                       # json (default) or cef
  #   facility: local0                   # kern, user, ..., local0 (default) to local7
  #   # tls:                             # tcp only
  #   #   enabled: true
  #   #   ca_file: /etc/ssl/syslog-ca.pem
  #   # Each event is one RFC 5424 message: PRI from facility and Falco priority,
  #   # HOSTNAME from the event (else this host), APP-NAME "falco". TCP and TLS
  #   # frame messages with octet counting (RFC 6587) and keep one connection,
  #   # reconnecting when the receiver closes it. The health check dials TCP and
  #   # TLS receivers (an untrusted certificate stops startup); UDP has no probe.

  # ===========================================================================
  # SMTP (one email per event)
  # ===========================================================================

  # smtp:
  #   host: "smtp.example.com"
  #   # port: 587                        # default 587, 465 with implicit, 25 with none
  #   tls_mode: starttls                 # starttls (default, required), implicit,
  #                                      # opportunistic (STARTTLS when offered), none
  #   auth_mechanism: plain              # plain (default), xoauth2, none
  #   username: falcosidekick
  #   password_file: /run/secrets/smtp-password
  #   # token_file: /run/secrets/smtp-token  # OAuth 2.0 access token for xoauth2
  #   from: "Falco <falco@example.com>"
  #   to:
  #     - "secops@example.com"
  #   output_format: html                # html (multipart with a text part, default) or text
  #   # Credentials are sent only over TLS, or in clear to localhost; xoauth2
  #   # needs tls_mode starttls or implicit. The health check connects,
  #   # negotiates TLS and authenticates without sending mail: rejected
  #   # credentials, a missing STARTTLS, AUTH or mechanism, or an untrusted
  #   # certificate stop startup.

  # ===========================================================================
  # Redis
  # ===========================================================================

  # redis:
  #   address: "redis:6379"              # host:port
  #   # username: falcosidekick          # ACL user; default user when empty
  #   password_file: /run/secrets/redis-password
  #   database: 0
  #   storage_type: stream               # stream (XADD, field "event", default), list (RPUSH),
  #                                      # hash (HSET field = event UUID)
  #   key: falco                         # required
  #   # max_len: 100000                  # stream only: default 100000, approximate (MAXLEN ~), 0 = unbounded
  #   # tls:
  #   #   enabled: true
  #   #   ca_file: /etc/ssl/redis-ca.pem
  #   # Values are the event JSON. Batches are sent in one pipeline. The health
  #   # check sends PING: rejected credentials (WRONGPASS, NOAUTH), missing ACL
  #   # permissions, an unknown database or an untrusted certificate stop startup.

  # ===========================================================================
  # OpenTelemetry (OTLP logs and metrics)
  # ===========================================================================

  # otlp:
  #   logs:                              # each section present enables its signal
  #     endpoint: "http://otel-collector:4318"  # http/protobuf: path defaults to /v1/logs
  #     protocol: http/protobuf          # http/protobuf (default) or grpc (no path)
  #     # timeout: 10s                   # per export, also bounds shutdown
  #     # compression: none              # none (default) or gzip
  #     headers:
  #       Authorization:
  #         secrets: ["Bearer TOKEN"]    # or files: [/run/secrets/otlp-auth]
  #   metrics:
  #     endpoint: "https://otel-collector:4317"
  #     protocol: grpc
  #     # tls:                           # https endpoints only
  #     #   ca_file: /etc/ssl/otel-ca.pem
  #     extra_attributes:                # output fields added to every data point
  #       - k8s.ns.name
  #   # One log record (event name falco.alert, severity from priority,
  #   # body = output) and one count on the falcosecurity.falco.rules.matches
  #   # counter per event, with falco.* and output field attributes. Each
  #   # delivery exports synchronously; OTEL_* environment variables are
  #   # ignored. Metrics are cumulative and exported on every delivery;
  #   # enable runtime.batching to reduce requests. No health check: OTLP has no
  #   # request that exports nothing. Header files are read at startup.
