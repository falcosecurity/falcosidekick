name: e2e

on:
  workflow_call:
  workflow_dispatch:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

permissions: {}

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Each service job sets FALCOSIDEKICK_E2E_REQUIRE: a test whose service variable is missing fails instead of skipping.
jobs:
  self-contained:
    name: e2e self-contained outputs
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Run end-to-end tests without external services
        run: go test -count=1 -v -tags e2e ./test/e2e/

  postgres:
    name: e2e postgres ${{ matrix.postgres }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        postgres: ['18.6', '17.11']
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}-alpine
        env:
          POSTGRES_USER: fsk
          POSTGRES_PASSWORD: fsk
          POSTGRES_DB: fsk
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fsk -d fsk"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Run database, replica and startup tests on postgres
        env:
          FALCOSIDEKICK_E2E_POSTGRES_DSN: postgres://fsk:fsk@127.0.0.1:5432/fsk?sslmode=disable
          FALCOSIDEKICK_E2E_POSTGRES_REQUIRED: '1'
        run: go test -count=1 -race -v ./internal/database/ ./internal/reload/ ./cmd/falcosidekick/

  loki:
    name: e2e loki ${{ matrix.loki }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        loki: ['3.7.9', '2.9.17']
    services:
      loki:
        image: grafana/loki:${{ matrix.loki }}
        ports:
          - 3100:3100
    env:
      FALCOSIDEKICK_E2E_REQUIRE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Start multi-tenant Loki
        env:
          LOKI_VERSION: ${{ matrix.loki }}
        run: |
          docker run -d --name loki-auth -p 127.0.0.1:3101:3100 "grafana/loki:${LOKI_VERSION}" \
            -config.file=/etc/loki/local-config.yaml -auth.enabled=true
      - name: Wait for Loki
        run: |
          for port in 3100 3101; do
            timeout 120 bash -c "until curl -fsS http://127.0.0.1:${port}/ready; do sleep 2; done"
          done
      - name: Run Loki tests
        env:
          FALCOSIDEKICK_E2E_LOKI_URL: http://127.0.0.1:3100
        run: go test -count=1 -v -tags e2e -run Loki ./test/e2e/
      - name: Run Loki tests with tenants enforced
        env:
          FALCOSIDEKICK_E2E_LOKI_URL: http://127.0.0.1:3101
        run: go test -count=1 -v -tags e2e -run Loki ./test/e2e/
      - name: Stop multi-tenant Loki
        if: always()
        run: docker rm -f loki-auth || true

  alertmanager:
    name: e2e alertmanager ${{ matrix.version }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        version: ['v0.34.2', 'v0.33.1']
    services:
      alertmanager:
        image: prom/alertmanager:${{ matrix.version }}
        ports:
          - 9093:9093
        options: >-
          --health-cmd "wget -q -O- http://127.0.0.1:9093/-/ready || exit 1"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      FALCOSIDEKICK_E2E_REQUIRE: '1'
      FALCOSIDEKICK_E2E_ALERTMANAGER_URL: http://127.0.0.1:9093
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Run Alertmanager tests
        run: go test -count=1 -v -tags e2e -run Alertmanager ./test/e2e/

  kafka:
    name: e2e kafka ${{ matrix.kafka }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        kafka: ['4.4.0', '3.9.2']
    env:
      FALCOSIDEKICK_E2E_REQUIRE: '1'
      FALCOSIDEKICK_E2E_KAFKA_BROKERS: 127.0.0.1:19094
      FALCOSIDEKICK_E2E_KAFKA_SASL_BROKERS: 127.0.0.1:19095
      FALCOSIDEKICK_E2E_KAFKA_SASL_USER: e2e
      FALCOSIDEKICK_E2E_KAFKA_SASL_PASSWORD: e2e-secret
      FALCOSIDEKICK_E2E_KAFKA_TLS_BROKERS: 127.0.0.1:19096
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Generate broker TLS material
        run: |
          d="$RUNNER_TEMP/kafka-tls"; mkdir -p "$d"; cd "$d" || exit 1
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 -subj /CN=fsk-e2e-ca -keyout ca.key -out ca.pem
          openssl req -newkey rsa:2048 -nodes -subj /CN=127.0.0.1 -keyout server.key -out server.csr
          printf 'subjectAltName=IP:127.0.0.1,DNS:localhost\n' > ext.cnf
          openssl x509 -req -in server.csr -CA ca.pem -CAkey ca.key -CAcreateserial -days 1 -extfile ext.cnf -out server.pem
          openssl pkcs8 -topk8 -nocrypt -in server.key -out server.pk8
          cat server.pk8 server.pem > keystore.pem
          chmod 644 keystore.pem ca.pem
          echo "FALCOSIDEKICK_E2E_KAFKA_TLS_CA_FILE=$d/ca.pem" >> "$GITHUB_ENV"
      - name: Start Kafka
        env:
          KAFKA_VERSION: ${{ matrix.kafka }}
        run: |
          docker run -d --name fsk-e2e-kafka \
            -p 127.0.0.1:19094:19094 -p 127.0.0.1:19095:19095 -p 127.0.0.1:19096:19096 \
            -v "$RUNNER_TEMP/kafka-tls/keystore.pem:/etc/kafka/e2e/keystore.pem:ro" \
            -e KAFKA_NODE_ID=1 -e KAFKA_PROCESS_ROLES=broker,controller \
            -e KAFKA_LISTENERS=INTERNAL://:29092,EXTERNAL://:19094,SASL://:19095,TLS://:19096,CONTROLLER://:9093 \
            -e KAFKA_ADVERTISED_LISTENERS=INTERNAL://localhost:29092,EXTERNAL://127.0.0.1:19094,SASL://127.0.0.1:19095,TLS://127.0.0.1:19096 \
            -e KAFKA_INTER_BROKER_LISTENER_NAME=INTERNAL -e KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER \
            -e KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,SASL:SASL_PLAINTEXT,TLS:SSL \
            -e KAFKA_CONTROLLER_QUORUM_VOTERS=1@localhost:9093 -e KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1 \
            -e KAFKA_AUTO_CREATE_TOPICS_ENABLE=false \
            -e KAFKA_LISTENER_NAME_SASL_SASL_ENABLED_MECHANISMS=PLAIN,SCRAM-SHA-256,SCRAM-SHA-512 \
            -e 'KAFKA_LISTENER_NAME_SASL_PLAIN_SASL_JAAS_CONFIG=org.apache.kafka.common.security.plain.PlainLoginModule required user_e2e="e2e-secret";' \
            -e 'KAFKA_LISTENER_NAME_SASL_SCRAM___SHA___256_SASL_JAAS_CONFIG=org.apache.kafka.common.security.scram.ScramLoginModule required;' \
            -e 'KAFKA_LISTENER_NAME_SASL_SCRAM___SHA___512_SASL_JAAS_CONFIG=org.apache.kafka.common.security.scram.ScramLoginModule required;' \
            -e KAFKA_LISTENER_NAME_TLS_SSL_KEYSTORE_TYPE=PEM \
            -e KAFKA_LISTENER_NAME_TLS_SSL_KEYSTORE_LOCATION=/etc/kafka/e2e/keystore.pem \
            "apache/kafka:${KAFKA_VERSION}"
          for _ in $(seq 1 60); do
            docker exec fsk-e2e-kafka /opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:29092 --list >/dev/null 2>&1 && break
            sleep 2
          done
          docker exec fsk-e2e-kafka /opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:29092 --list
          for m in SCRAM-SHA-256 SCRAM-SHA-512; do
            docker exec fsk-e2e-kafka /opt/kafka/bin/kafka-configs.sh --bootstrap-server localhost:29092 \
              --alter --entity-type users --entity-name e2e --add-config "$m=[password=e2e-secret]"
          done
      - name: Run Kafka tests
        run: go test -count=1 -v -tags e2e -run Kafka ./test/e2e/
      - name: Kafka logs
        if: failure()
        run: docker logs --tail 200 fsk-e2e-kafka
      - name: Stop Kafka
        if: always()
        run: docker rm -f fsk-e2e-kafka || true

  elasticsearch:
    name: e2e ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: elasticsearch-7, image: "docker.io/library/elasticsearch:7.17.28", flavor: es7 }
          - { name: elasticsearch-8, image: "docker.io/library/elasticsearch:8.19.23", flavor: es }
          - { name: elasticsearch-9, image: "docker.io/library/elasticsearch:9.5.5", flavor: es }
          - { name: opensearch-2, image: "docker.io/opensearchproject/opensearch:2.19.7", flavor: os }
          - { name: opensearch-3, image: "docker.io/opensearchproject/opensearch:3.9.0", flavor: os }
    env:
      FALCOSIDEKICK_E2E_REQUIRE: '1'
      ES_PASSWORD: "Falcosidekick-E2E-2026!"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Start server
        env:
          IMAGE: ${{ matrix.image }}
          FLAVOR: ${{ matrix.flavor }}
        run: |
          sudo sysctl -w vm.max_map_count=262144
          args=(-e discovery.type=single-node -e "ES_JAVA_OPTS=-Xms512m -Xmx512m" -e "OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m")
          case "$FLAVOR" in
            es7) scheme=http; user="elastic"; args+=(-e xpack.security.enabled=true -e xpack.security.authc.api_key.enabled=true -e "ELASTIC_PASSWORD=$ES_PASSWORD") ;;
            es)  scheme=https; user="elastic"; args+=(-e "ELASTIC_PASSWORD=$ES_PASSWORD") ;;
            os)  scheme=https; user="admin"; args+=(-e "OPENSEARCH_INITIAL_ADMIN_PASSWORD=$ES_PASSWORD") ;;
          esac
          docker run -d --name es -p 127.0.0.1:9200:9200 "${args[@]}" "$IMAGE"
          url="$scheme://127.0.0.1:9200"
          for _ in $(seq 1 90); do
            curl -skf -u "$user:$ES_PASSWORD" "$url/_cluster/health?wait_for_status=yellow&timeout=1s" >/dev/null && break
            sleep 2
          done
          curl -skf -u "$user:$ES_PASSWORD" "$url/"
          certs="$RUNNER_TEMP/es-certs"; mkdir -p "$certs"
          {
            echo "FALCOSIDEKICK_ES_URL=$url"; echo "FALCOSIDEKICK_E2E_ES_URL=$url"
            echo "FALCOSIDEKICK_ES_USERNAME=$user"; echo "FALCOSIDEKICK_E2E_ES_USERNAME=$user"
            echo "FALCOSIDEKICK_ES_PASSWORD=$ES_PASSWORD"; echo "FALCOSIDEKICK_E2E_ES_PASSWORD=$ES_PASSWORD"
          } >> "$GITHUB_ENV"
          case "$FLAVOR" in
            es)
              docker cp es:/usr/share/elasticsearch/config/certs/http_ca.crt "$certs/ca.pem"
              { echo "FALCOSIDEKICK_ES_CA_FILE=$certs/ca.pem"; echo "FALCOSIDEKICK_E2E_ES_CA_FILE=$certs/ca.pem"; } >> "$GITHUB_ENV" ;;
            os)
              docker cp es:/usr/share/opensearch/config/root-ca.pem "$certs/ca.pem"
              docker cp es:/usr/share/opensearch/config/kirk.pem "$certs/client.pem"
              docker cp es:/usr/share/opensearch/config/kirk-key.pem "$certs/client-key.pem"
              {
                echo "FALCOSIDEKICK_ES_CA_FILE=$certs/ca.pem"; echo "FALCOSIDEKICK_E2E_ES_CA_FILE=$certs/ca.pem"
                echo "FALCOSIDEKICK_ES_API_KEYS=false"
                echo "FALCOSIDEKICK_ES_CLIENT_CERT=$certs/client.pem"; echo "FALCOSIDEKICK_ES_CLIENT_KEY=$certs/client-key.pem"
              } >> "$GITHUB_ENV" ;;
          esac
      - name: Driver integration tests
        run: go test -count=1 -v -tags integration -run TestLiveElasticsearch ./internal/outputs/elasticsearch/
      - name: End-to-end tests
        run: go test -count=1 -v -tags e2e -run Elasticsearch ./test/e2e/
      - name: Server logs on failure
        if: failure()
        run: docker logs --tail 200 es
      - name: Stop server
        if: always()
        run: docker rm -f es || true

  aws:
    name: e2e aws s3, sqs, sns (localstack)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      FALCOSIDEKICK_E2E_REQUIRE: '1'
      FALCOSIDEKICK_E2E_AWS_ENDPOINT: http://127.0.0.1:4566
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Start LocalStack
        run: |
          docker run -d --name fsk-e2e-localstack -p 127.0.0.1:4566:4566 -e SERVICES=s3,sqs,sns,sts localstack/localstack:4.14.0
          timeout 120 bash -c 'until curl -fsS http://127.0.0.1:4566/_localstack/health | grep -q "\"sns\": \"\(available\|running\)\""; do sleep 2; done'
      - name: Run AWS tests
        run: go test -count=1 -v -tags e2e -run TestAWS ./test/e2e/
      - name: LocalStack logs
        if: failure()
        run: docker logs --tail 200 fsk-e2e-localstack
      - name: Stop LocalStack
        if: always()
        run: docker rm -f fsk-e2e-localstack || true

  gcppubsub:
    name: e2e gcp pub/sub (emulator)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      FALCOSIDEKICK_E2E_REQUIRE: '1'
      FALCOSIDEKICK_E2E_PUBSUB_EMULATOR: 127.0.0.1:8085
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Start Pub/Sub emulator
        run: |
          docker run -d --name fsk-e2e-pubsub -p 127.0.0.1:8085:8085 \
            gcr.io/google.com/cloudsdktool/google-cloud-cli:592.0.0-emulators \
            gcloud beta emulators pubsub start --host-port=0.0.0.0:8085 --project=fsk-e2e
          timeout 120 bash -c 'until docker logs fsk-e2e-pubsub 2>&1 | grep -q "Server started"; do sleep 2; done'
      - name: Run Pub/Sub tests
        run: go test -count=1 -v -tags e2e -run TestGCPPubSub ./test/e2e/
      - name: Stop emulator
        if: always()
        run: docker rm -f fsk-e2e-pubsub || true

  smtp:
    name: e2e smtp (mailpit)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      FALCOSIDEKICK_E2E_REQUIRE: '1'
      FALCOSIDEKICK_E2E_SMTP_ADDR: localhost:11025
      FALCOSIDEKICK_E2E_SMTP_USER: fsk
      FALCOSIDEKICK_E2E_SMTP_PASSWORD: fsk-e2e-password
      FALCOSIDEKICK_E2E_MAILPIT_API: http://127.0.0.1:18025
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Start Mailpit
        run: |
          docker run -d --name fsk-e2e-mailpit -p 127.0.0.1:11025:1025 -p 127.0.0.1:18025:8025 \
            -e MP_SMTP_AUTH="${FALCOSIDEKICK_E2E_SMTP_USER}:${FALCOSIDEKICK_E2E_SMTP_PASSWORD}" \
            -e MP_SMTP_TLS_CERT=sans:localhost -e MP_SMTP_TLS_KEY=sans:localhost \
            -e MP_SMTP_REQUIRE_STARTTLS=true axllent/mailpit:v1.33.0
          timeout 60 bash -c 'until curl -fsS http://127.0.0.1:18025/readyz; do sleep 1; done'
      - name: Run SMTP tests
        run: go test -count=1 -v -tags e2e -run TestSMTP ./test/e2e/
      - name: Stop Mailpit
        if: always()
        run: docker rm -f fsk-e2e-mailpit || true

  redis:
    name: e2e redis 7.4 and 8
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      FALCOSIDEKICK_E2E_REQUIRE: '1'
      FALCOSIDEKICK_E2E_REDIS_ADDR: 127.0.0.1:16379,127.0.0.1:16380
      FALCOSIDEKICK_E2E_REDIS_PASSWORD: fsk-e2e-redis
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Start Redis
        run: |
          docker run -d --name fsk-e2e-redis7 -p 127.0.0.1:16379:6379 redis:7.4.12 redis-server --requirepass "$FALCOSIDEKICK_E2E_REDIS_PASSWORD"
          docker run -d --name fsk-e2e-redis8 -p 127.0.0.1:16380:6379 redis:8.10.3 redis-server --requirepass "$FALCOSIDEKICK_E2E_REDIS_PASSWORD"
          for c in fsk-e2e-redis7 fsk-e2e-redis8; do
            timeout 60 bash -c "until docker exec $c redis-cli -a \"\$FALCOSIDEKICK_E2E_REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG; do sleep 1; done"
          done
      - name: Run Redis tests
        run: go test -count=1 -v -tags e2e -run TestRedis ./test/e2e/
      - name: Stop Redis
        if: always()
        run: docker rm -f fsk-e2e-redis7 fsk-e2e-redis8 || true

  otlp:
    name: e2e otlp (collector)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      FALCOSIDEKICK_E2E_REQUIRE: '1'
      FALCOSIDEKICK_E2E_OTLP_GRPC: http://127.0.0.1:14317
      FALCOSIDEKICK_E2E_OTLP_HTTP: http://127.0.0.1:14318
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Start collector
        run: |
          out="$RUNNER_TEMP/otel-out"; mkdir -p "$out"; chmod 777 "$out"
          echo "FALCOSIDEKICK_E2E_OTLP_FILE=$out" >> "$GITHUB_ENV"
          docker run -d --name fsk-e2e-otel -p 127.0.0.1:14317:4317 -p 127.0.0.1:14318:4318 \
            -v "$PWD/test/e2e/testdata/otel-collector.yaml:/etc/otelcol-contrib/config.yaml:ro" \
            -v "$out:/out" otel/opentelemetry-collector-contrib:0.164.0
          timeout 60 bash -c 'until (echo > /dev/tcp/127.0.0.1/14318) 2>/dev/null; do sleep 1; done'
      - name: Run OTLP tests
        run: go test -count=1 -v -tags e2e -run TestOTLP ./test/e2e/
      - name: Collector logs
        if: failure()
        run: docker logs --tail 200 fsk-e2e-otel
      - name: Stop collector
        if: always()
        run: docker rm -f fsk-e2e-otel || true

  policyreport:
    name: e2e policyreport (kind, openreports)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    env:
      FALCOSIDEKICK_E2E_REQUIRE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: helm/kind-action@ea822c7bf1874f08e5a491df991c228edffc3376 # v1.15.2
        with:
          version: v0.30.0
          cluster_name: fsk-policyreport
      - name: Install openreports CRDs
        run: |
          kubectl apply -f https://github.com/openreports/reports-api/releases/download/v0.2.1/install.yaml
          kubectl wait --for condition=Established --timeout=120s crd/reports.openreports.io crd/clusterreports.openreports.io
          kind get kubeconfig --name fsk-policyreport > "$RUNNER_TEMP/kubeconfig"
          echo "FALCOSIDEKICK_E2E_KUBECONFIG=$RUNNER_TEMP/kubeconfig" >> "$GITHUB_ENV"
      - name: Run PolicyReport tests
        run: go test -count=1 -p 1 -v -tags e2e -run TestPolicyReport ./test/e2e/
