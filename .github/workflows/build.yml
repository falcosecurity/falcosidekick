name: build

on:
  workflow_dispatch:
  push:
    branches:
      - master

permissions: {}

jobs:
  checks:
    uses: ./.github/workflows/test.yml
    permissions:
      contents: read

  build-snapshot:
    name: goreleaser snapshot
    needs: [checks]
    if: github.repository == 'falcosecurity/falcosidekick' && github.ref == 'refs/heads/master'
    concurrency: publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version: '1.26'
          check-latest: true
          cache: false

      - uses: oven-sh/setup-bun@4bc047ad259df6fc24a6c9b0f9a0cb08cf17fbe5 # v2.0.2
        with:
          bun-version: '1.3'

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - uses: anchore/sbom-action/download-syft@17ae1740179002c89186b61233e0f892c3118b11 # v0.23.0

      - name: Login to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        env:
          DOCKERHUB_OIDC_CONNECTIONID: ${{ vars.DOCKERHUB_OIDC_CONNECTION }}
          DOCKERHUB_OIDC_EXPIREIN: 600
        with:
          username: falcosecurity

      - uses: goreleaser/goreleaser-action@ec59f474b9834571250b370d4735c50f8e2d1e29 # v7.0.0
        with:
          version: v2.18.2
          args: release --snapshot --clean --skip=sign
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify and publish development images
        id: publish-snapshot
        shell: bash
        run: |
          set -euo pipefail
          images=(falcosecurity/falcosidekick)
          image="${images[0]}"
          for variant in ui slim; do
            suffix=""
            [[ "$variant" != slim ]] || suffix=-slim
            for arch in amd64 arm64; do
              local_image="${image}:v3-main${suffix}-${arch}"
              [[ "$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "$local_image")" == "$GITHUB_SHA" ]]
              [[ "$(docker image inspect --format '{{ index .Config.Labels "io.falcosecurity.falcosidekick.variant" }}' "$local_image")" == "$variant" ]]
              [[ "$(docker image inspect --format '{{.Os}}/{{.Architecture}}' "$local_image")" == "linux/$arch" ]]
              version="$(docker run --rm --network=none --platform "linux/$arch" "$local_image" --version)"
              [[ "$version" == "falcosidekick v3-main (commit: $GITHUB_SHA, built: "* ]]
              [[ "$version" != *"built: unknown"* ]]
            done
          done
          # Snapshot mode loads platform images locally; it does not publish them.
          for image in "${images[@]}"; do
            for suffix in "" -slim; do
              for arch in amd64 arm64; do
                remote_image="${image}:v3-main-${GITHUB_SHA}${suffix}-${arch}"
                docker tag "${image}:v3-main${suffix}-${arch}" "$remote_image"
                docker push "$remote_image"
              done
            done
          done
          for image in "${images[@]}"; do
            for suffix in "" -slim; do
              docker buildx imagetools create --tag "${image}:v3-main${suffix}" \
                "${image}:v3-main-${GITHUB_SHA}${suffix}-amd64" \
                "${image}:v3-main-${GITHUB_SHA}${suffix}-arm64"
            done
          done
