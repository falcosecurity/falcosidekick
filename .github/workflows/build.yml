name: build

on:
  workflow_dispatch:
  push:
    branches:
      - master

permissions: {}

jobs:
  checks:
    uses: ./.github/workflows/test.yml
    permissions:
      contents: read

  lint:
    uses: ./.github/workflows/lint.yml
    permissions:
      contents: read

  build-snapshot:
    name: goreleaser snapshot
    needs: [checks, lint]
    if: github.repository == 'falcosecurity/falcosidekick' && github.ref == 'refs/heads/master'
    # Snapshots queue among themselves, apart from releases; a newer master build may replace a queued one.
    concurrency:
      group: snapshot-${{ github.ref }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: ui/package.json

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

      - uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3

      # Snapshot mode builds and loads the images locally; it publishes nothing and needs no token.
      - name: Build the development images
        id: snapshot
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: v2.18.2
          args: release --snapshot --clean --skip=sign

      - name: Login to Docker Hub
        id: login
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        env:
          DOCKERHUB_OIDC_CONNECTIONID: ${{ vars.DOCKERHUB_OIDC_CONNECTION }}
          DOCKERHUB_OIDC_EXPIREIN: 600
        with:
          username: falcosecurity

      - name: Verify and publish development images
        id: publish-snapshot
        shell: bash
        run: |
          set -euo pipefail
          images=(falcosecurity/falcosidekick)
          image="${images[0]}"
          for variant in ui slim; do
            suffix=""
            [[ "$variant" != slim ]] || suffix=-slim
            for arch in amd64 arm64; do
              local_image="${image}:v3-main${suffix}-${arch}"
              [[ "$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "$local_image")" == "$GITHUB_SHA" ]]
              [[ "$(docker image inspect --format '{{ index .Config.Labels "io.falcosecurity.falcosidekick.variant" }}' "$local_image")" == "$variant" ]]
              [[ "$(docker image inspect --format '{{.Os}}/{{.Architecture}}' "$local_image")" == "linux/$arch" ]]
              version="$(docker run --rm --network=none --platform "linux/$arch" "$local_image" --version)"
              [[ "$version" == "falcosidekick v3-main (commit: $GITHUB_SHA, built: "* ]]
              [[ "$version" != *"built: unknown"* ]]
            done
          done
          # Snapshot mode loads platform images locally; it does not publish them.
          for image in "${images[@]}"; do
            for suffix in "" -slim; do
              for arch in amd64 arm64; do
                remote_image="${image}:v3-main-${GITHUB_SHA}${suffix}-${arch}"
                docker tag "${image}:v3-main${suffix}-${arch}" "$remote_image"
                docker push "$remote_image"
              done
            done
          done
          for image in "${images[@]}"; do
            for suffix in "" -slim; do
              docker buildx imagetools create --tag "${image}:v3-main${suffix}" \
                "${image}:v3-main-${GITHUB_SHA}${suffix}-amd64" \
                "${image}:v3-main-${GITHUB_SHA}${suffix}-arm64"
            done
          done

      # Keyless, by digest: the signature covers the index and, with --recursive, each platform image.
      - name: Sign development images
        id: sign-snapshot
        shell: bash
        run: |
          set -euo pipefail
          image=falcosecurity/falcosidekick
          for suffix in "" -slim; do
            digest="$(docker buildx imagetools inspect --format '{{json .Manifest}}' "${image}:v3-main${suffix}" | jq -r .digest)"
            [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "::error::no digest for ${image}:v3-main${suffix}"; exit 1; }
            cosign sign --yes --recursive "${image}@${digest}"
          done
