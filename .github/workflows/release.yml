name: release

on:
  workflow_dispatch:
  push:
    tags:
      - "v3.*"

permissions: {}

jobs:
  checks:
    uses: ./.github/workflows/test.yml
    permissions:
      contents: read

  e2e:
    uses: ./.github/workflows/e2e.yml
    permissions:
      contents: read

  release:
    name: goreleaser release
    needs: [checks, e2e]
    if: github.repository == 'falcosecurity/falcosidekick' && startsWith(github.ref, 'refs/tags/v3.')
    concurrency: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version: '1.26'
          check-latest: true
          cache: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.0.2
        with:
          bun-version: '1.3'

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

      - uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3

      - name: Login to Docker Hub
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        env:
          DOCKERHUB_OIDC_CONNECTIONID: ${{ vars.DOCKERHUB_OIDC_CONNECTION }}
          DOCKERHUB_OIDC_EXPIREIN: 600
        with:
          username: falcosecurity

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::292999226676:role/github_actions-falcosidekick-ecr
          aws-region: us-east-1

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7
        with:
          registry-type: public

      - name: Decide the image aliases
        id: aliases
        shell: bash
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          stable="$(git tag --list 'v3.*' | grep -E '^v3\.[0-9]+\.[0-9]+$' || true)"
          minor="${tag%.*}"
          highest="$(sort -V <<<"$stable" | tail -n1)"
          highest_minor="$(grep -E "^${minor//./\\.}\.[0-9]+$" <<<"$stable" | sort -V | tail -n1 || true)"
          latest_major=false
          latest_minor=false
          [[ "$tag" != "$highest" ]] || latest_major=true
          [[ "$tag" != "$highest_minor" ]] || latest_minor=true
          echo "FSK_LATEST_MAJOR=$latest_major" >> "$GITHUB_ENV"
          echo "FSK_LATEST_MINOR=$latest_minor" >> "$GITHUB_ENV"

      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: v2.18.2
          args: release --clean --timeout 120m
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
