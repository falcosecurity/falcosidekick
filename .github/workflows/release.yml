name: release

on:
  workflow_dispatch:
  push:
    tags:
      - "v3.*"

permissions: {}

jobs:
  checks:
    uses: ./.github/workflows/test.yml
    permissions:
      contents: read

  lint:
    uses: ./.github/workflows/lint.yml
    permissions:
      contents: read

  e2e:
    uses: ./.github/workflows/e2e.yml
    permissions:
      contents: read

  release:
    name: goreleaser release
    needs: [checks, lint, e2e]
    if: github.repository == 'falcosecurity/falcosidekick' && startsWith(github.ref, 'refs/tags/v3.')
    # One group per tag, apart from snapshots: no other run can replace a queued release.
    concurrency:
      group: release-${{ github.ref }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 150
    permissions:
      contents: write
      id-token: write
    outputs:
      hashes: ${{ steps.hash.outputs.hashes }}
      tag_name: ${{ github.ref_name }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: ui/package.json

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

      - uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3

      - name: Decide the image aliases
        id: aliases
        shell: bash
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          stable="$(git tag --list 'v3.*' | grep -E '^v3\.[0-9]+\.[0-9]+$' || true)"
          minor="${tag%.*}"
          highest="$(sort -V <<<"$stable" | tail -n1)"
          highest_minor="$(grep -E "^${minor//./\\.}\.[0-9]+$" <<<"$stable" | sort -V | tail -n1 || true)"
          latest_major=false
          latest_minor=false
          [[ "$tag" != "$highest" ]] || latest_major=true
          [[ "$tag" != "$highest_minor" ]] || latest_minor=true
          echo "FSK_LATEST_MAJOR=$latest_major" >> "$GITHUB_ENV"
          echo "FSK_LATEST_MINOR=$latest_minor" >> "$GITHUB_ENV"

      # goreleaser pushes and signs the images within --timeout; the token outlives the push.
      - name: Login to Docker Hub
        id: login
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        env:
          DOCKERHUB_OIDC_CONNECTIONID: ${{ vars.DOCKERHUB_OIDC_CONNECTION }}
          DOCKERHUB_OIDC_EXPIREIN: 3600
        with:
          username: falcosecurity

      - name: Run GoReleaser
        id: run-goreleaser
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: v2.18.2
          args: release --clean --timeout 120m
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # The SLSA subjects are the lines of the checksum file: every uploaded release file but the signatures.
      - name: Generate the provenance subjects
        id: hash
        shell: bash
        env:
          ARTIFACTS: ${{ steps.run-goreleaser.outputs.artifacts }}
        run: |
          set -euo pipefail
          checksums="$(jq -er '[.[] | select(.type == "Checksum") | .path] | if length == 1 then .[0] else error("want one checksum file, got \(length)") end' <<<"$ARTIFACTS")"
          [[ -s "$checksums" ]] || { echo "::error::$checksums is missing or empty"; exit 1; }
          echo "hashes=$(base64 < "$checksums" | tr -d '\n')" >> "$GITHUB_OUTPUT"

  provenance:
    needs: [release]
    permissions:
      actions: read # the generator reads the workflow path
      id-token: write # to sign the provenance
      contents: write # to upload it to the release
    # The SLSA generator verifies its own ref: it must be called by tag, not by commit SHA.
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.1.0
    with:
      base64-subjects: ${{ needs.release.outputs.hashes }}
      upload-assets: true
      upload-tag-name: ${{ needs.release.outputs.tag_name }}
