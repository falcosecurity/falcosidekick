name: build-image

on:
  pull_request:
    branches:
      - master

permissions: {}

concurrency:
  group: build-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-image:
    name: build-image
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version: '1.26'
          check-latest: true
          cache: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.0.2
        with:
          bun-version: '1.3'

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Build the release images without publishing
        id: snapshot
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: v2.18.2
          args: release --snapshot --clean --skip=publish,sign,sbom

      - name: Check the images run
        shell: bash
        run: |
          set -euo pipefail
          for suffix in "" -slim; do
            for arch in amd64 arm64; do
              image="falcosecurity/falcosidekick:v3-main${suffix}-${arch}"
              docker run --rm --network=none --platform "linux/$arch" "$image" --version
            done
          done
